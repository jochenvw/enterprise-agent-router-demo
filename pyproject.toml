[project]
name = "enterprise-agent-router-demo"
version = "0.1.0"
description = "A2A capability discovery and semantic routing demo for overlapping enterprise agents."
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk>=0.3.20",
  "agent-framework-a2a>=1.0.0b260730,<2",
  "azure-identity>=1.24.0",
  "azure-monitor-opentelemetry>=1.8.0",
  "azure-search-documents>=11.6.0",
  "httpx>=0.28.0",
  "openai>=1.100.0,<4",
  "opentelemetry-api>=1.36.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "sse-starlette>=3.0.0,<4",
  "starlette>=0.47.0,<2",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[project.scripts]
serve-agent = "agents.server:main"
index-agents = "registry.index_agents:main"
route-query = "orchestrator.cli:main"
route-query-batch = "orchestrator.cli:main_batch"
eval-router = "evals.run_router:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "orchestrator", "registry", "shared", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
